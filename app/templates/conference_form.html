{% extends 'base.html' %}
{% block contenu %}
<a href="{{ url_for('conference', id_conf=conf.id_conf) if conf.id_conf else url_for('conferences') }}"
   class="small text-decoration-none d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Retour</a>

<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-{{ 'pencil-square' if conf.id_conf else 'plus-circle' }} me-2"></i>
        {{ 'Modifier la conférence' if conf.id_conf else 'Nouvelle conférence' }}
      </div>
      <form method="post" class="card-body p-4">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Intitulé</label>
          <input class="form-control" name="intitule" value="{{ conf.intitule or '' }}" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold"><i class="bi bi-calendar-event me-1"></i>Date de début</label>
            <input class="form-control" type="date" name="date_debut" value="{{ conf.date_debut or '' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold"><i class="bi bi-calendar-check me-1"></i>Date de fin</label>
            <input class="form-control" type="date" name="date_fin" value="{{ conf.date_fin or '' }}" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold"><i class="bi bi-geo-alt me-1"></i>Ville</label>
            <select class="form-select" name="id_ville" required>
              {% for v in villes %}<option value="{{ v.id_ville }}" {{ 'selected' if v.id_ville == conf.id_ville }}>{{ v.nom_ville }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold"><i class="bi bi-building me-1"></i>Organisme</label>
            <select class="form-select" name="id_organisme" required>
              {% for o in organismes %}<option value="{{ o.id_organisme }}" {{ 'selected' if o.id_organisme == conf.id_organisme }}>{{ o.nom }}</option>{% endfor %}
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold"><i class="bi bi-collection me-1"></i>Série <span class="text-muted fw-normal">(facultatif)</span></label>
            <select class="form-select" name="id_serie"><option value="">—</option>
              {% for s in series %}<option value="{{ s.id_serie }}" {{ 'selected' if s.id_serie == conf.id_serie }}>{{ s.sigle }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold"><i class="bi bi-book me-1"></i>Éditeur des actes <span class="text-muted fw-normal">(facultatif)</span></label>
            <select class="form-select" name="id_editeur"><option value="">—</option>
              {% for e in editeurs %}<option value="{{ e.id_editeur }}" {{ 'selected' if e.id_editeur == conf.id_editeur }}>{{ e.nom_editeur }}</option>{% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Texte introductif</label>
          <textarea class="form-control" name="texte_introductif" rows="5" required>{{ conf.texte_introductif or '' }}</textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn btn-light" href="{{ url_for('conference', id_conf=conf.id_conf) if conf.id_conf else url_for('conferences') }}">Annuler</a>
          <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
